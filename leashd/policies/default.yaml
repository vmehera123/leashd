version: "1.0"
name: default
rules:
  # Deny rules first — these must match before broad allow rules
  - name: credential-files
    tools: [Read, Write, Edit]
    path_patterns:
      - "\\.env$|\\.env\\.(?!(example|sample|template|dist)$)"
      - "\\.ssh/|\\.aws/|\\.gnupg/"
      - "\\.key$|\\.pem$|\\.p12$|\\.pfx$|\\.keystore$"
      - "id_rsa|id_ed25519|id_ecdsa|id_dsa|credentials|secrets?|token\\.json$"
    action: deny
    reason: "Credential/sensitive file access blocked"

  - name: no-force-push
    tool: Bash
    command_patterns: ["git\\s+push.*(-f|--force)"]
    action: deny
    reason: "Force push blocked"

  - name: destructive-bash
    tool: Bash
    command_patterns:
      - "\\bsudo\\b"
      - "\\b(curl|wget)\\b.*\\|.*\\b(bash|sh|zsh)\\b"
      - "\\bchmod\\s+777\\b"
      - "\\b(DROP|TRUNCATE)\\s+(TABLE|DATABASE)\\b"
    action: deny
    reason: "Destructive or dangerous command"

  # Recursive delete asks rather than denies: in practice the target is the
  # agent's own litter (build dirs, caches, logs), and a hard deny ended the
  # whole job to protect a cache directory. An approval keeps a human in the
  # loop without ending the work; nothing here runs unattended. `sudo`,
  # pipe-to-shell, `chmod 777`, SQL `DROP` and force-push stay denied above.
  - name: recursive-delete
    tool: Bash
    command_patterns:
      - "(?:^|[;&|`(\\n]|\\$\\()\\s*(?:sudo\\s+)?rm\\s+(?:-\\S+\\s+)*-\\S*[rR]\\S*[fF]"
      - "(?:^|[;&|`(\\n]|\\$\\()\\s*(?:sudo\\s+)?rm\\s+(?:-\\S+\\s+)*-\\S*[fF]\\S*[rR]"
      - "(?:^|[;&|`(\\n]|\\$\\()\\s*(?:sudo\\s+)?rm\\s+(?:-\\S+\\s+)*-[rR]\\s+(?:-\\S+\\s+)*-[fF]\\b"
      - "(?:^|[;&|`(\\n]|\\$\\()\\s*(?:sudo\\s+)?rm\\s+(?:-\\S+\\s+)*-[fF]\\s+(?:-\\S+\\s+)*-[rR]\\b"
      - "(?:^|[;&|`(\\n]|\\$\\()\\s*(?:sudo\\s+)?rm\\s+(?:-\\S+\\s+)*--recursive\\b"
    action: require_approval
    reason: "Recursive delete — confirm the path before it runs"
    risk_level: high

  # `credential-files` above is scoped to Read/Write/Edit, so it never sees a
  # shell command: `cat <repo>/.env` and `echo … >> ~/.ssh/authorized_keys` are
  # otherwise cleared outright by `read-only-bash` below, and claude's native
  # deny globs — the only thing that used to stop them — are anchored at `~/`
  # and installed by the tmux runtime alone.
  #
  # One credential path per pattern, unanchored, so the tmux runtime mirrors
  # each as a narrow `permissions.ask` glob (`Bash(*.ssh/*)`) instead of
  # prompting on every `cat`. Patterns are matched against what the shell
  # executes, quoting respected, so a path named inside a quoted remote payload
  # (`ssh host 'ls ~/.ssh/'`) is not a local credential access and does not
  # match.
  - name: credential-metadata
    tool: Bash
    command_patterns:
      - "^(ls|stat|file|test|\\[\\[?)(\\s|$)(?=.*(\\.env\\b(?!\\.(example|sample|template|dist))|\\.ssh/|\\.aws/|\\.gnupg/|authorized_keys|\\.pem\\b|\\.key\\b|\\.p12\\b|\\.pfx\\b|\\.keystore\\b|id_rsa|id_ed25519|id_ecdsa|id_dsa|\\.git-credentials\\b|credentials\\b|secrets?\\.|token\\.json\\b))"
      - "^git\\s+(-C\\s+\\S+\\s+)?(status|check-ignore|ls-files)\\b(?=.*(\\.env\\b(?!\\.(example|sample|template|dist))|\\.ssh/|\\.aws/|\\.gnupg/|authorized_keys|\\.pem\\b|\\.key\\b|\\.p12\\b|\\.pfx\\b|\\.keystore\\b|id_rsa|id_ed25519|id_ecdsa|id_dsa|\\.git-credentials\\b|credentials\\b|secrets?\\.|token\\.json\\b))"
    action: allow
    description: "Metadata of a credential path (listing, existence, ignore status) without reading it"

  - name: credential-bash
    tool: Bash
    command_patterns:
      - "\\.env\\b(?!\\.(example|sample|template|dist))"
      - "\\.ssh/"
      - "\\.aws/"
      - "\\.gnupg/"
      - "authorized_keys"
      - "\\.pem\\b"
      - "\\.key\\b"
      - "\\.p12\\b"
      - "\\.pfx\\b"
      - "\\.keystore\\b"
      - "id_rsa"
      - "id_ed25519"
      - "id_ecdsa"
      - "id_dsa"
      - "\\.git-credentials\\b"
      - "credentials\\b"
      - "secret\\."
      - "secrets\\."
      - "token\\.json\\b"
    action: require_approval
    description: "Shell access to a credential path"
    risk_level: critical

  # Matched against the SQL an interpreter is handed, not the shell skeleton:
  # `sqlite3 db "DROP TABLE users"` passes its statement positionally, which
  # the floor read as an inert string while the identical `psql -c` form was
  # denied. Anchored at the start of that payload, which no shell command can
  # look like — nothing is named `INSERT INTO`.
  - name: sql-write
    tool: Bash
    command_patterns:
      - "(?i)(^|[;(])\\s*(INSERT\\s+(OR\\s+\\w+\\s+)?INTO|UPDATE\\s+\\S+\\s+SET|DELETE\\s+FROM|REPLACE\\s+INTO|ALTER\\s+(TABLE|DATABASE|INDEX|VIEW)|CREATE\\s+((UNIQUE|TEMP|TEMPORARY)\\s+)*(TABLE|INDEX|DATABASE|VIEW|TRIGGER)|ATTACH\\s|DETACH\\s|VACUUM\\b|REINDEX\\b|PRAGMA\\s+\\w+\\s*=|COPY\\s)"
    action: require_approval
    description: "SQL statement that writes"
    risk_level: high

  # Allow rules
  - name: agent-internal-tools
    tools: [AskUserQuestion, ExitPlanMode, Task, TaskCreate, TaskUpdate, TaskList, TaskGet, TodoWrite, EnterPlanMode, Skill]
    action: allow

  - name: read-only-tools
    tools: [Read, Glob, Grep, WebSearch, WebFetch, LS, ToolSearch]
    action: allow

  - name: background-task-tools
    tools: [Monitor, BashOutput, KillShell]
    action: allow
    description: "Observe/manage background shells the agent already started (Monitor = watch a command's output)"

  - name: browser-readonly-tools
    tools:
      - browser_snapshot
      - browser_take_screenshot
      - browser_console_messages
      - browser_network_requests
      - browser_tab_list
      - browser_wait_for
      - browser_generate_playwright_test
    action: allow
    description: "Read-only browser observation"

  - name: codebase-memory-readonly
    tools:
      - search_graph
      - query_graph
      - trace_path
      - get_code_snippet
      - get_graph_schema
      - get_architecture
      - search_code
      - list_projects
      - index_status
      - detect_changes
      - manage_adr
    action: allow
    description: "Read-only codebase memory graph queries"

  - name: agent-browser-privileged
    tool: Bash
    command_patterns:
      - "^agent-browser\\s+(batch|chat|confirm|connect|dashboard|deny|install|mcp|plugin|stream|upgrade)\\b"
      - "^agent-browser\\s+doctor\\b.*--fix"
    action: require_approval
    description: "Privileged agent-browser operation (code install, listener, real-Chrome attach, third-party send)"

  # Every pattern ends in the same tail: any argument text, then only pipes
  # into a text filter. Reading a page is read-only; `… | curl -d @-` is an
  # upload of whatever was read, and the rule matching first means nothing
  # downstream of the pipe is ever examined.
  - name: agent-browser-readonly
    tool: Bash
    command_patterns:
      - "^agent-browser\\s+(snapshot|screenshot|console|errors|get|is|wait|diff|highlight|react|skills|profiles)\\b[^|]*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
      - "^agent-browser\\s+(read|a11y|vitals)\\b(?!.*(https?://|\\bwww\\.))[^|]*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
      - "^agent-browser\\s+doctor\\b[^|]*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
      - "^agent-browser\\s+session\\b[^|]*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
      - "^agent-browser\\s+tab(\\s+list)?(\\s+--\\S+)*\\s*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
      - "^agent-browser(\\s+(--version|-V|--help|-h))?\\s*(\\|\\s*(jq|head|tail|wc|grep|rg|sort|uniq|column|cat|cut|tr)\\b[^|]*)*$"
    action: allow
    description: "Read-only agent-browser observation"

  - name: loopback-read
    tool: Bash
    command_patterns:
      - "^(?:curl|wget) (?:127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|::1)(?:,(?:127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|::1))*$"
    action: allow
    description: "Read-only request to a loopback address"

  # `sql-write` is ordered ahead of this and takes the writing forms.
  # `sqlite3 db < script.sql` carries no visible statement, so it matches
  # nothing here and stays an ask.
  - name: sql-read
    tool: Bash
    command_patterns:
      - "(?i)^(?![^\\\\]*(\\b(INSERT|UPDATE|DELETE|MERGE|COPY|CREATE|DROP|ALTER|TRUNCATE|ATTACH|DETACH|VACUUM|REINDEX|GRANT|REVOKE)\\b|\\bREPLACE\\s+INTO\\b|\\bPRAGMA\\s+\\w+\\s*=))\\s*(SELECT|WITH|EXPLAIN|PRAGMA|\\.tables|\\.schema|\\.databases|\\.dbinfo|\\.indexes)\\b[^;\\\\]*(;\\s*((SELECT|WITH|EXPLAIN|PRAGMA|\\.tables|\\.schema|\\.databases|\\.dbinfo|\\.indexes)\\b[^;\\\\]*)?)*$"
    action: allow
    description: "Read-only SQL query"

  - name: read-only-bash
    tool: Bash
    command_patterns:
      - "^(cd|ls|cat|head|tail|grep|wc|du|df|pwd|echo|date|whoami|which|type|file|stat|read)\\b"
      - "^find\\b(?![^|]*\\s-(delete|exec|execdir|ok|okdir|fprint|fprint0|fprintf|fls)\\b)"
      - "^git\\s+(-(?!c\\s)[a-zA-Z]\\s+\\S+\\s+|--(?!config-env|exec-path)[a-z-]+(=\\S+)?\\s+)*?(status|log|diff|show|branch|remote|tag|rev-parse|rev-list|ls-files|ls-tree|blame|describe|shortlog|merge-base|cat-file|check-ignore|name-rev|count-objects|for-each-ref|show-ref|reflog(?!\\s+(expire|delete)\\b)|stash\\s+(list|show)|worktree\\s+list|config\\s+(--get|--get-all|--get-regexp|--list|-l))\\b"
      # `tee` and `split` are absent because writing files is what they are for.
      - "^(sort|uniq|cut|tr|column|nl|rev|tac|comm|join|paste|fold|expand|unexpand|fmt|shuf|jq|tree|printf|seq|true|false|test|sleep|yes)\\b"
      - "^rg\\b(?![^|]*\\s--pre(=|\\s|$))"
      - "^ag\\b(?![^|]*\\s--pager\\b)"
      - "^\\[\\[?\\s"
      - "^(uv\\s+run\\s+(--no-project\\s+)?)?python3?\\s+-m\\s+json\\.tool\\b"
      - "^(vm_stat|memory_pressure|nproc)\\b"
      - "^sysctl\\b(?![^|]*(\\s-w\\b|=))"
      - "^pmset\\s+-g\\b"
      - "^[gm]?awk\\b(?![^|]*\\s(-[fiEl]\\b|--(file|include|load|exec)\\b))"
      - "^(node|npm|npx|pnpm|yarn|bun|deno|python3?|uv|pip3?|ruby|go|cargo|rustc|java|docker|podman|git|make|tmux|gh|kubectl|helm|terraform|brew|psql|sqlite3|jq|rg|curl|wget|ssh|openssl|ffmpeg|claude|codex|tsc|vite|playwright)\\s+(--version|-V)\\s*$"
      - "^(node|npm|npx|pnpm|yarn|bun|deno)\\s+-v\\s*$"
      - "^(go|kubectl|helm|terraform|gh)\\s+version(\\s+--\\S+)*\\s*$"
      # `base64` is absent: decode-to-shell smuggles an executable payload
      # past a text allowlist.
      - "^(basename|dirname|realpath|readlink|diff|cmp|md5|md5sum|shasum|sha1sum|sha256sum|sha512sum|cksum|od|xxd|hexdump|strings)\\b"
      # `pkill`/`kill` are absent — they act. `env` reaches here only bare:
      # `env FOO=1 <cmd>` is peeled to `<cmd>` before any rule sees it.
      - "^(ps|pgrep|pstree|lsof|jobs|uptime|id|groups|hostname|uname|arch|sw_vers|locale|printenv|env)\\b"
      # No `-i`/`--in-place` (edits the file) and no `-f`/`--file` (a program
      # leashd cannot see). The program is a payload candidate, so a `w`/`e`
      # command naming a credential path is taken by `credential-bash` above.
      - "^sed\\b(?![^|]*\\s-[a-zA-Z]*[if]\\b)(?![^|]*\\s--(?:in-place|file)\\b)"
      # `\\;` is refused: tmux uses it to chain a second command that the
      # reporting verb in front would otherwise vouch for.
      - "^tmux\\b(?![^|]*\\\\;)[^|]*\\s(list-sessions|list-panes|list-windows|list-clients|list-buffers|list-keys|list-commands|capture-pane|display-message|display|show-options|show-environment|has-session|info)\\b"
    action: allow

  - name: docker-readonly
    tool: Bash
    command_patterns:
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+(ps|images|logs|info|version|top|port|history|diff|stats)\\b"
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+(container\\s+)?inspect\\b(?=[^|]*\\s(-f|--format)(=|\\s))"
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+(container|image|volume|network|context|node|service|stack)\\s+(ls|list|logs|top|port|history|ps|stats|diff)\\b"
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+(image|volume|network|context)\\s+inspect\\b"
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+system\\s+(df|info)\\b"
      - "^(docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+(manifest\\s+inspect|buildx\\s+(ls|du|version)|context\\s+show)\\b"
      - "^((docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+compose|docker-compose|podman-compose)(\\s+(-f|--file|-p|--project-name|--profile|--env-file|--project-directory|--ansi|--progress|--parallel)(=|\\s+)\\S+)*\\s+(ps|logs|images|top|port|ls|version)\\b"
      - "^((docker|podman)(\\s+(--context|-c|--host|-H|--log-level|-l|--config)(=|\\s+)\\S+)*\\s+compose|docker-compose|podman-compose)(\\s+(-f|--file|-p|--project-name|--profile|--env-file|--project-directory|--ansi|--progress|--parallel)(=|\\s+)\\S+)*\\s+config\\b(?=[^|]*\\s(--services|--volumes|--profiles|--images|--quiet|-q)\\b)"
    action: allow
    description: "Read-only Docker/Podman inspection"

  - name: dev-checks
    tool: Bash
    command_patterns:
      - "^((uv|poetry|hatch|pdm|rye)\\s+run(\\s+(--(project|directory|package|python|group|extra)|-p)(=|\\s+)\\S+|\\s+--?[a-z][\\w-]*)*\\s+|uvx(\\s+(--python|-p)(=|\\s+)\\S+|\\s+--?[a-z][\\w-]*)*\\s+|pipx\\s+run\\s+|python3?\\s+-m\\s+|(npx|bunx)(\\s+--?[\\w-]+)*\\s+|(pnpm|yarn|bun|npm)\\s+exec(\\s+--)?\\s+|(pnpm|yarn)\\s+|bun\\s+x\\s+)?(ruff|mypy|dmypy|pyright|basedpyright|black|isort|flake8|pylint|pyflakes|pycodestyle|pydocstyle|autopep8|yapf|ty|tsc|vue-tsc|svelte-check|eslint|prettier|biome|oxlint|stylelint|dprint|golangci-lint|gofmt|goimports|staticcheck|rustfmt|shellcheck|shfmt|markdownlint|markdownlint-cli2|yamllint|taplo|hadolint|actionlint|sqlfluff|rubocop|swiftlint|swiftformat|ktlint|clang-format)(\\s|$)"
      - "^(npm|pnpm|yarn|bun)(\\s+(-C|--dir|--prefix|--filter|-F|--workspace|-w|--cwd)(=|\\s+)\\S+|\\s+(-r|--recursive|-s|--silent|--if-present|-ws|--workspaces))*\\s+(run\\s+)?(lint|format|fmt|typecheck|type-check|types|check-types|tsc|check)([:-][\\w:-]*)?(\\s|$)"
      - "^(make|just)(\\s+(-C\\s*\\S+|--directory(=|\\s+)\\S+|-f\\s*\\S+|--file(=|\\s+)\\S+|-j\\s*\\d*|--jobs(=\\d+)?|-[sknw]+))*\\s+(lint|format|fmt|typecheck|type-check|types|check)([:-][\\w:-]*)?(\\s|$)"
      - "^go\\s+(vet|fmt)(\\s|$)"
      - "^cargo\\s+(fmt|clippy|check)(\\s|$)"
    action: allow
    description: "Linter, formatter or type checker"

  - name: plan-file-writes
    tools: [Write, Edit]
    path_patterns:
      - "\\.plan$"
      - "\\.claude/plans/"
    action: allow

  # Approval-required rules
  - name: git-mutations
    tool: Bash
    command_patterns:
      - "^git\\s+(-[a-zA-Z]\\s+\\S+\\s+|--[a-z-]+(=\\S+)?\\s+)*?(push|reset|rebase|merge|cherry-pick|rm)\\b"
    action: require_approval
    description: "Git mutation"

  - name: network-bash
    tool: Bash
    command_patterns: ["^(curl|wget|ssh|scp|rsync)\\b"]
    action: require_approval
    description: "Network access"

  - name: browser-mutation-tools
    tools:
      - browser_navigate
      - browser_navigate_back
      - browser_navigate_forward
      - browser_click
      - browser_type
      - browser_hover
      - browser_drag
      - browser_press_key
      - browser_select_option
      - browser_file_upload
      - browser_handle_dialog
      - browser_fill_form
      - browser_evaluate
      - browser_tabs
      - browser_tab_new
      - browser_tab_select
      - browser_tab_close
      - browser_resize
      - browser_pdf_save
      - browser_close
      - browser_install
    action: require_approval
    description: "Browser interaction/mutation"

  - name: agent-browser-mutations
    tool: Bash
    command_patterns:
      - "^agent-browser\\s+(auth|back|check|click|clipboard|close|cookies|dblclick|device|dialog|download|drag|eval|fill|find|focus|forward|frame|hover|inspect|keyboard|keydown|keyup|mouse|network|open|pdf|press|profiler|pushstate|record|reload|removeinitscript|scroll|scrollintoview|select|set|state|storage|swipe|tap|trace|type|uncheck|upload|window)\\b"
      - "^agent-browser\\s+(read|a11y|vitals)\\b.*(https?://|\\bwww\\.)"
      - "^agent-browser\\s+tab\\s+\\S"
    action: require_approval
    description: "Agent-browser interaction/mutation"

settings:
  default_action: require_approval
  approval_timeout_seconds: 300
